<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kado Abadi — the gift that keeps on giving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" async></script>
<script>
/* Kado Abadi — impact calculator. Pure functions. Mirror of calc.js; keep both in sync. */
(function (root) {
  const NET_YIELD = 0.06, UNIT_PRICE = 1000, MIN_GIFT = 250000, MAX_GIFT = 10000000, STEP = 50000;
  const CAUSES = {
    pohon:   { unit:"pohon", cost:25000,  icon:"i-tree", region:["Jawa Barat","Banten","NTT","Kalimantan Timur"] },
    makan:   { unit:"porsi", cost:15000,  icon:"i-meal", region:["Jakarta","Yogyakarta","Makassar","Papua"] },
    sekolah: { unit:"bulan", cost:300000, icon:"i-book", region:["NTT","Sumba","Lombok","Aceh"] },
  };
  const OCCASIONS = { lahir:{}, ultah:{}, nikah:{}, mengenang:{} };
  const api = {
    NET_YIELD, UNIT_PRICE, MIN_GIFT, MAX_GIFT, STEP, CAUSES, OCCASIONS,
    perYearRp: A => A * NET_YIELD,
    units: (A, c, N) => Math.floor(A * NET_YIELD * N / c),
    oneTime: (A, c) => Math.floor(A / c),
    crossover: () => Math.ceil(1 / NET_YIELD),
    unitsMinted: A => Math.floor(A / UNIT_PRICE),
  };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  root.KadoCalc = api;
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>
<style>
:root{
  --paper:#F2F4EC; --ink:#17301F; --moss:#2F5C3F; --leaf:#7FA86C; --marigold:#DFA92D; --mist:#DCE3D6;
  --bg:var(--paper); --fg:var(--ink); --muted:#5B6B5E; --line:#CBD4C6; --card:#FFFFFF; --accent:var(--moss); --accent-fg:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0F1F16; --fg:#EEF2E8; --muted:#A5B3A7; --line:#2C4334; --card:#17301F; --accent:#7FA86C; --accent-fg:#0F1F16; --mist:#1E3325; } }
:root[data-theme="dark"]{ --bg:#0F1F16; --fg:#EEF2E8; --muted:#A5B3A7; --line:#2C4334; --card:#17301F; --accent:#7FA86C; --accent-fg:#0F1F16; --mist:#1E3325; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--fg); font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
h1,h2,h3,.serif{ font-family:"Fraunces","Iowan Old Style",Georgia,serif; font-weight:400; letter-spacing:-0.01em; line-height:1.12; margin:0; }
h1{ font-size:clamp(34px,7vw,46px); font-variation-settings:"opsz" 144,"SOFT" 60; }
h2{ font-size:27px; } h3{ font-size:20px; }
p{ margin:0 0 12px; } a{ color:inherit; }
button,input,select,textarea{ font:inherit; color:inherit; } img{ max-width:100%; display:block; }

.app{ max-width:480px; margin:0 auto; min-height:100%; padding:0 18px 56px; }
.top{ display:flex; align-items:center; justify-content:space-between; padding:16px 0 8px; }
.brand{ text-decoration:none; display:flex; align-items:center; gap:8px; font-family:"Fraunces",serif; font-size:20px; }
.brand svg{ width:22px; height:22px; }
.lang{ display:flex; border:1.5px solid var(--line); border-radius:999px; overflow:hidden; font-size:12px; font-weight:600; }
.lang button{ border:0; background:transparent; padding:6px 10px; cursor:pointer; color:var(--muted); }
.lang button[aria-pressed="true"]{ background:var(--fg); color:var(--bg); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:999px; padding:14px 22px; background:var(--accent); color:var(--accent-fg); font-weight:600; cursor:pointer; text-decoration:none; }
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{ outline:3px solid var(--marigold); outline-offset:2px; }
.btn.quiet{ background:transparent; color:var(--fg); border:1.5px solid var(--line); }
.btn.gold{ background:var(--marigold); color:var(--ink); }
.btn.wide{ width:100%; } .btn:disabled{ opacity:.5; cursor:not-allowed; }
.muted{ color:var(--muted); } .small{ font-size:13px; } .tiny{ font-size:11.5px; color:var(--muted); } .gap{ height:20px; }

/* Photo blocks */
.photo-hero{ position:relative; border-radius:22px; overflow:hidden; aspect-ratio:4/5; background:#1C3A28; }
.photo-hero img{ width:100%; height:100%; object-fit:cover; }
.photo-hero .shade{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(23,48,31,0) 35%,rgba(23,48,31,.55) 70%,rgba(23,48,31,.92) 100%); }
.photo-hero .text{ position:absolute; left:0; right:0; bottom:0; padding:22px 20px 20px; color:#F2F4EC; }
.photo-hero .kick{ font-size:13px; opacity:.85; margin-bottom:4px; }
.photo-hero h1{ color:#F2F4EC; }
.photo-hero .date{ font-size:13px; opacity:.85; margin-top:6px; }
.photo-hero .ribbon{ position:absolute; top:16px; left:16px; background:var(--marigold); color:var(--ink); font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; }

/* Landing */
.hero{ padding:22px 0 6px; } .hero h1{ margin-bottom:12px; } .hero p{ font-size:17px; max-width:36ch; }
.paths{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 26px; }
.path{ text-align:left; border:1.5px solid var(--line); background:var(--card); border-radius:18px; padding:16px 14px; cursor:pointer; text-decoration:none; display:flex; flex-direction:column; gap:6px; }
.path b{ font-family:"Fraunces",serif; font-weight:400; font-size:20px; } .path span{ font-size:12.5px; color:var(--muted); }
.occasions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0 10px; }
.occ{ position:relative; text-align:left; border:0; border-radius:18px; padding:0; cursor:pointer; aspect-ratio:1/1.15; overflow:hidden; background:#1C3A28; color:#F2F4EC; }
.occ img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.occ .shade{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(23,48,31,.05) 40%,rgba(23,48,31,.9) 100%); }
.occ .t{ position:absolute; left:14px; right:14px; bottom:14px; }
.occ b{ display:block; font-family:"Fraunces",serif; font-weight:400; font-size:20px; } .occ span{ font-size:12.5px; opacity:.85; }
.feat{ margin-top:28px; } .feat h3{ margin-bottom:10px; }
.featcard{ display:block; text-decoration:none; border-radius:18px; overflow:hidden; position:relative; aspect-ratio:16/10; background:#1C3A28; color:#F2F4EC; margin-bottom:12px; }
.featcard img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.featcard .shade{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(23,48,31,0) 30%,rgba(23,48,31,.92) 100%); }
.featcard .t{ position:absolute; left:16px; right:16px; bottom:14px; }
.featcard b{ font-family:"Fraunces",serif; font-weight:400; font-size:22px; display:block; } .featcard span{ font-size:12.5px; opacity:.9; }
.how{ margin:26px 0 0; border-top:1px solid var(--line); padding-top:18px; } .how ol{ padding-left:18px; margin:8px 0 0; } .how li{ margin-bottom:6px; }

/* Form */
.field{ margin:18px 0; } .field label{ display:block; font-weight:600; margin-bottom:8px; } .field .hint{ font-size:12.5px; color:var(--muted); margin-top:6px; }
.input{ width:100%; border:1.5px solid var(--line); background:var(--card); border-radius:12px; padding:13px 14px; } textarea.input{ min-height:84px; resize:vertical; }
.pills{ display:flex; flex-wrap:wrap; gap:8px; }
.pill{ border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:9px 14px; cursor:pointer; }
.pill[aria-pressed="true"]{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
.photo{ display:flex; align-items:center; gap:14px; }
.avatar{ width:64px; height:64px; border-radius:50%; background:var(--marigold); color:var(--ink); display:grid; place-items:center; font-family:"Fraunces",serif; font-size:26px; overflow:hidden; flex:none; }
.avatar img{ width:100%; height:100%; object-fit:cover; }
.cover-pick{ position:relative; border-radius:16px; overflow:hidden; aspect-ratio:16/10; background:var(--mist); display:block; }
.cover-pick img{ width:100%; height:100%; object-fit:cover; }
input[type=range]{ width:100%; accent-color:var(--moss); }
.amount{ display:flex; justify-content:space-between; align-items:baseline; } .amount b{ font-family:"Fraunces",serif; font-weight:400; font-size:30px; }
.locked{ background:var(--mist); border-radius:14px; padding:12px 14px; display:flex; gap:12px; align-items:center; margin-top:8px; }
.locked img{ width:52px; height:52px; border-radius:12px; object-fit:cover; flex:none; }

/* Calculator */
.calc{ background:var(--card); border:1.5px solid var(--line); border-radius:20px; padding:18px 16px 16px; margin-top:10px; }
.calc .lead{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.calc .lead b{ font-family:"Fraunces",serif; font-weight:400; font-size:34px; line-height:1; } .calc .lead span{ text-align:right; }
.grove{ display:grid; grid-template-columns:repeat(auto-fill,minmax(22px,1fr)); gap:4px; margin:14px 0 6px; min-height:56px; }
.grove svg{ width:100%; aspect-ratio:1; display:block; } .grove .on{ color:var(--moss); } .grove .ghost{ color:var(--line); }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .grove .on{ color:var(--leaf); } }
.legend{ display:flex; gap:14px; font-size:12.5px; color:var(--muted); flex-wrap:wrap; } .legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:5px; }
.years{ margin-top:14px; } .years .row{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:4px; }
.cross{ margin-top:12px; padding:10px 12px; border-radius:12px; background:var(--mist); font-size:13.5px; } .cross.hit{ background:var(--marigold); color:var(--ink); }
.compare{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:14px; } .compare div{ border-top:2px solid var(--line); padding-top:8px; }
.compare b{ display:block; font-family:"Fraunces",serif; font-weight:400; font-size:20px; } .compare span{ font-size:12px; color:var(--muted); }

/* Poster */
.poster{ position:relative; aspect-ratio:1080/1350; width:100%; border-radius:18px; overflow:hidden; background:#1C3A28; color:#F2F4EC; container-type:inline-size; }
.poster .bg{ position:absolute; inset:0; } .poster .frame{ position:absolute; inset:5%; border:1px solid rgba(242,244,236,.35); border-radius:8px; }
.poster .content{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; text-align:center; padding:10% 9% 8%; }
.poster .kicker{ font-size:3.4cqw; opacity:.85; } .poster .name{ font-family:"Fraunces",serif; font-size:11cqw; line-height:1; margin:2% 0 0; }
.poster .arch{ width:46%; aspect-ratio:1/1.18; border-radius:50% 50% 8% 8% / 42% 42% 8% 8%; overflow:hidden; margin:6% 0 5%; background:#DFA92D; display:grid; place-items:center; font-family:"Fraunces",serif; font-size:16cqw; color:#17301F; }
.poster .arch img{ width:100%; height:100%; object-fit:cover; }
.poster .line{ font-family:"Fraunces",serif; font-style:italic; font-size:5cqw; line-height:1.3; max-width:82%; } .poster .from{ margin-top:auto; font-size:3.6cqw; opacity:.9; }
.poster .footer{ position:absolute; left:9%; right:9%; bottom:7%; display:flex; align-items:flex-end; justify-content:space-between; }
.poster .seal{ width:20%; aspect-ratio:1; border-radius:50%; background:#DFA92D; color:#17301F; display:grid; place-items:center; text-align:center; font-size:2.4cqw; line-height:1.15; font-weight:700; transform:rotate(-8deg); box-shadow:0 0 0 .8cqw #1C3A28,0 0 0 1cqw #DFA92D; }
.poster .seal small{ display:block; font-weight:500; font-size:2cqw; }
.poster .qr{ background:#F2F4EC; padding:1.4cqw; border-radius:1.6cqw; width:19%; aspect-ratio:1; display:grid; place-items:center; } .poster .qr img,.poster .qr canvas{ width:100% !important; height:100% !important; display:block; }
.poster .fid{ position:absolute; left:0; right:0; bottom:3%; text-align:center; font-size:2.4cqw; opacity:.7; letter-spacing:.06em; }

/* Campaign + gift pages */
.stat{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; } .stat div{ background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:14px; }
.stat b{ display:block; font-family:"Fraunces",serif; font-weight:400; font-size:26px; line-height:1.1; } .stat span{ font-size:12.5px; color:var(--muted); }
.strip{ display:grid; grid-template-columns:repeat(3,1fr); margin:6px 0 18px; border:1.5px solid var(--line); border-radius:16px; overflow:hidden; background:var(--card); }
.strip div{ padding:14px 12px; border-right:1.5px solid var(--line); } .strip div:last-child{ border-right:0; }
.strip b{ display:block; font-family:"Fraunces",serif; font-weight:400; font-size:24px; line-height:1.1; } .strip span{ font-size:12px; color:var(--muted); }
.story{ font-size:18px; line-height:1.5; margin:18px 0 8px; font-style:italic; }
.host{ display:flex; gap:10px; align-items:center; font-size:13px; color:var(--muted); margin-bottom:6px; }
.host .avatar{ width:32px; height:32px; font-size:14px; }
.givers{ list-style:none; margin:8px 0 0; padding:0; }
.givers li{ display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); align-items:flex-start; } .givers li:last-child{ border-bottom:0; }
.givers .avatar{ width:40px; height:40px; font-size:17px; background:var(--mist); color:var(--fg); }
.givers .who{ display:flex; justify-content:space-between; gap:8px; } .givers .who span:last-child{ color:var(--muted); font-size:13px; white-space:nowrap; }
.givers .msg{ font-family:"Fraunces",serif; font-style:italic; font-size:15.5px; margin-top:2px; } .givers .meta{ font-size:12px; color:var(--muted); margin-top:4px; }
.timeline{ margin:8px 0 0; padding:0; list-style:none; border-left:2px solid var(--line); } .timeline li{ position:relative; padding:0 0 18px 18px; }
.timeline li::before{ content:""; position:absolute; left:-7px; top:6px; width:12px; height:12px; border-radius:50%; background:var(--moss); border:2px solid var(--bg); } .timeline li.proj::before{ background:var(--bg); border:2px solid var(--line); }
.timeline .when{ font-size:12.5px; color:var(--muted); } .timeline .what{ font-family:"Fraunces",serif; font-size:19px; margin:2px 0 6px; }
.stamp{ font-size:11.5px; color:var(--muted); line-height:1.55; } .stamp .share{ color:var(--fg); }
.wa{ background:#E7FFDB; color:#111; border-radius:14px 14px 14px 4px; padding:12px 14px; font-size:14px; line-height:1.45; margin:10px 0 4px; box-shadow:0 1px 0 rgba(0,0,0,.08); }
.wa .who{ font-size:12px; color:#1F7A4F; font-weight:600; margin-bottom:2px; } .wa .time{ text-align:right; font-size:10.5px; color:#667; margin-top:4px; }
.section{ margin-top:26px; } .section h3{ margin-bottom:8px; }
.sticky{ position:sticky; bottom:calc(12px + env(safe-area-inset-bottom,0px)); margin-top:22px; }
.credit{ font-size:11px; color:var(--muted); margin-top:6px; }

.modal{ position:fixed; inset:0; background:rgba(15,31,22,.55); display:none; align-items:flex-end; justify-content:center; z-index:9; } .modal.open{ display:flex; }
.sheet{ background:var(--card); color:var(--fg); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px)); }
.pay{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); } .pay:last-of-type{ border-bottom:0; }
.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:14px; display:none; z-index:10; max-width:90vw; } .toast.show{ display:block; }
.hidden{ display:none !important; }
/* Trust fund split */
.split{ background:var(--card); border:1.5px solid var(--line); border-radius:20px; padding:16px; margin-top:10px; }
.split .halves{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.split .half{ border-radius:14px; padding:12px; background:var(--mist); }
.split .half.priv{ background:var(--marigold); color:var(--ink); }
.split .half small{ display:block; font-size:11.5px; opacity:.8; margin-bottom:4px; }
.split .half b{ display:block; font-family:"Fraunces",serif; font-weight:400; font-size:22px; line-height:1.1; }
.split .half span{ font-size:12px; opacity:.85; }
.split .pct{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-top:4px; }
.lock{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); }
.priv-note{ margin-top:14px; padding:12px 14px; border-radius:14px; border:1.5px dashed var(--line); font-size:13px; color:var(--muted); display:flex; justify-content:space-between; gap:10px; align-items:center; }
.priv-note a{ white-space:nowrap; font-weight:600; color:var(--fg); }
.age{ display:inline-block; background:var(--mist); border-radius:999px; padding:4px 10px; font-size:12px; margin-top:8px; }
/* Owner dashboard */
.owner-hero{ background:var(--ink); color:#F2F4EC; border-radius:22px; padding:22px 20px; margin-top:8px; }
.owner-hero .kick{ font-size:12px; opacity:.7; letter-spacing:.06em; text-transform:uppercase; }
.owner-hero h1{ color:#F2F4EC; font-size:40px; margin:6px 0 2px; }
.owner-hero .sub{ opacity:.8; font-size:13px; }
.product{ border:1.5px solid var(--line); border-radius:16px; padding:14px; display:flex; gap:12px; align-items:flex-start; margin-top:10px; }
.product .seal2{ flex:none; width:44px; height:44px; border-radius:50%; background:var(--marigold); color:var(--ink); display:grid; place-items:center; font-weight:700; font-size:11px; text-align:center; line-height:1; }
.product b{ display:block; } .product span{ font-size:12.5px; color:var(--muted); }
.yeargrp{ margin-top:14px; } .yeargrp h4{ margin:0 0 4px; font-family:"Fraunces",serif; font-weight:400; font-size:18px; }
/* Landing B: gift-card */
.app.wide{ max-width:1040px; }
.b-hero{ text-align:center; padding:28px 0 18px; } .b-hero h1{ font-size:clamp(34px,4.5vw,54px); max-width:22ch; margin:0 auto 10px; } .b-hero p{ color:var(--muted); font-size:17px; }
.b-grid{ display:grid; grid-template-columns:1.05fr .95fr; gap:28px; align-items:start; }
@media (max-width:820px){ .b-grid{ grid-template-columns:1fr; } }
.b-form{ background:var(--card); border:1.5px solid var(--line); border-radius:24px; padding:22px; }
.b-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; } .b-row.three{ grid-template-columns:1fr 1fr 1fr; }
@media (max-width:520px){ .b-row,.b-row.three{ grid-template-columns:1fr; } }
.b-form .field{ margin:12px 0; } .b-form label{ font-size:13px; }
.b-sentence{ font-family:"Fraunces",serif; font-size:24px; line-height:1.35; display:flex; flex-wrap:wrap; gap:8px 10px; align-items:baseline; margin-bottom:14px; }
.b-sentence .blank{ border-bottom:2px solid var(--marigold); min-width:90px; display:inline-block; color:var(--fg); }
.b-card{ position:sticky; top:16px; }
.b-card .poster{ box-shadow:0 30px 60px -30px rgba(23,48,31,.6); }
.b-foot{ text-align:center; font-size:12.5px; color:var(--muted); margin-top:26px; }
.ab{ text-align:center; margin-top:28px; font-size:12px; color:var(--muted); } .ab a{ color:var(--muted); }
</style>
</head>
<body style="background:#17301F;color:#EEF2E8">
<div class="app" id="app"><div style="padding:40px 20px"><p style="font-size:18px">🌱 Kado Abadi</p><p style="opacity:.6;font-size:14px">Loading…</p></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-tree" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 5 12h3l-3 5h6v5h2v-5h6l-3-5h3z"/></symbol>

function ageMonths(dateStr){ const b = new Date(dateStr), n = new Date(); return Math.max(0, (n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth()) - (n.getDate()<b.getDate()?1:0)); }
function nextBirthday(dateStr){ const b = new Date(dateStr), n = new Date(); let y = n.getFullYear(); let d = new Date(y, b.getMonth(), b.getDate()); if (d < n) d = new Date(y+1, b.getMonth(), b.getDate()); return { date:d, nth: d.getFullYear()-b.getFullYear() }; }
const trustAt = (amount, months, ageTarget) => amount * Math.pow(1+TRUST_RATE, Math.max(0, ageTarget - months/12));

/* ---------- calculator ---------- */
function grove(eternal, oneTime, icon){
  const cap = 150; const n = Math.min(Math.max(eternal, oneTime), cap); let out = "";
  for (let i=0;i<n;i++) out += `<svg class="${i < eternal ? "on" : "ghost"}" viewBox="0 0 24 24"><use href="#${icon}"/></svg>`;
  const extra = Math.max(eternal, oneTime) - cap;
  return `<div class="grove">${out}</div>` + (extra > 0 ? `<p class="tiny">+${nf(extra)}</p>` : "");
}
function calcCard(A, causeKey, N){
  const t = T(), c = CAUSES[causeKey], unit = causeUnit(causeKey);
  const eternal = calc.units(A, c.cost, N), once = calc.oneTime(A, c.cost), cross = calc.crossover(), perYear = A*NET_YIELD/c.cost, hit = N >= cross;
  return `<div class="calc">
    <div class="lead"><b>${nf(eternal)}</b><span><div>${unit} ${causeVerb(causeKey)}</div><div class="small muted">${t.inYears(N)}</div></span></div>
    ${grove(eternal, once, c.icon)}
    <div class="legend"><span><i style="background:var(--moss)"></i>${t.legendA(N)}</span><span><i style="background:var(--line)"></i>${t.legendB}</span></div>
    <div class="years"><input type="range" id="years" min="1" max="100" value="${N}" aria-label="years"><div class="row"><span>${t.y1}</span><span>${t.yN(N)}</span><span>${t.y100}</span></div></div>
    <div class="cross ${hit?"hit":""}">${hit ? t.crossHit(cross) : t.crossNot(once, unit, cross)}</div>
    <div class="compare"><div><b>${once}</b><span>${t.cmpOnce}</span></div><div><b>${eternal}</b><span>${t.cmpEternal(N)}</span></div><div><b>${rp(A)}</b><span>${t.cmpPrincipal}</span></div></div>
    <p class="tiny" style="margin-top:10px">${t.projNote(rp(A*NET_YIELD), Math.round(NET_YIELD*100), perYear.toFixed(1), unit)}</p>
  </div>`;
}

    const id = "KP-" + cdraft.title.trim().toUpperCase().replace(/[^A-Z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,20) + "-" + String(Math.floor(Math.random()*9000)+1000);
    const story = (cdraft.story || t.storyDefault[cdraft.occasion]).trim();
    campaigns[id] = { id, occasion:cdraft.occasion, title:cdraft.title.trim(), host:cdraft.host.trim(), wa:cdraft.wa, photo:cdraft.photo?null:PHOTOS[cdraft.occasion].url, credit:cdraft.photo?"":PHOTOS[cdraft.occasion].credit, date:cdraft.date||new Date().toISOString().slice(0,10), cause:cdraft.cause, region:cdraft.region, story:{ id:story, en:story }, trust:(cdraft.occasion==="lahir"||cdraft.occasion==="ultah") && cdraft.trust };
    if (cdraft.photo) { photos[id] = cdraft.photo; try { localStorage.setItem("ka.photo."+id, cdraft.photo); } catch(e){} }
    persist(); toast(t.pageCreated); cdraft.title=""; cdraft.story=""; cdraft.photo=null; go("/c/"+id);
  };
  finish();
}

/* ---------- campaign page ---------- */
function renderCampaign(c){

  const story = typeof c.story === "string" ? c.story : (c.story[lang] || c.story.id);
  const te = trustEligible(c); const isChild = c.occasion==="lahir"||c.occasion==="ultah"; const nb = isChild ? nextBirthday(c.date) : null;
  app.innerHTML = topBar() + `
  <div class="photo-hero"><img src="${campaignPhoto(c)}" alt=""><div class="shade"></div><div class="ribbon">${occName(c.occasion)}</div>
    <div class="text"><div class="kick">${occKick(c.occasion)}</div><h1>${esc(c.title)}</h1><div class="date">${fmtDate(c.date)} · ${esc(c.region)}</div>${isChild ? `<span class="age">${t.ageLbl(ageMonths(c.date))} · ${t.nextBday(nb.nth, fmtDate(nb.date))}</span>` : ""}</div></div>
  ${c.credit ? `<div class="credit">${t.photoCredit}: ${c.credit}</div>` : ""}
  <p class="story serif">“${esc(story)}”</p>
  <div class="host"><div class="avatar">${initial(c.host)}</div><span>${t.hostedBy(esc(c.host))}</span></div>
  <div class="stat">
    <div><b>${gs.length}</b><span>${t.peopleLbl}</span></div>
    <div><b>${Math.floor(perYear)} ${unit}</b><span>${t.everyYearLbl}</span></div>
    <div><b>${rp(total)}</b><span>${t.totalIn}</span></div>
    <div><b>${delivered} ${unit}</b><span>${t.delivered(causeVerb(c.cause))}</span></div>
  </div>
  <a class="btn gold wide" href="#/create?c=${c.id}">${t.plantAlong}</a>
  <div class="section"><h3>${t.collective}</h3>
    ${total > 0 ? grove(calc.units(total, cc.cost, 10), calc.oneTime(total, cc.cost), cc.icon) : ""}
    <div class="strip">${[1,10,100].map(N=>`<div><b>${nf(calc.units(total, cc.cost, N))}</b><span>${t.inN(unit,N)}</span></div>`).join("")}</div>
    <p class="tiny">${t.projStrip(Math.round(NET_YIELD*100), calc.oneTime(total, cc.cost), unit, calc.crossover())}</p>
  </div>
  <div class="section"><h3>${t.givers}</h3>
    ${gs.length ? `<ul class="givers">${gs.map(g => `<li><div class="avatar">${initial(g.giver.name)}</div><div style="flex:1">
      <div class="who"><span style="font-weight:600">${esc(g.giver.name)}</span><span>${rp(causePart(g))}</span></div>
      ${g.message ? `<div class="msg">“${esc(g.message)}”</div>` : ""}
      <div class="meta">${fmtDate(g.createdAt)} · ~${(causePart(g)*NET_YIELD/cc.cost).toFixed(1)} ${unit}/${t.perYearShort}${trustPart(g)>0?` · 🔒 ${t.posterPlus}`:""} · <a href="#/gift/${g.id}">${t.certLink}</a></div></div></li>`).join("")}</ul>` : `<p class="muted">${t.noGivers}</p>`}
  </div>
  ${te ? `<div class="priv-note"><span>🔒 ${t.privNote(esc(c.title))}</span><a href="#/owner/${c.id}">${t.ownerLink} →</a></div>` : ""}
  <div class="section"><h3>${t.sharePage}</h3>
    <a class="btn quiet wide" href="https://wa.me/?text=${encodeURIComponent(t.cShare(c.title, url))}" target="_blank" rel="noopener">${isChild ? t.reshare(nb.nth) : t.shareWa}</a><div style="height:10px"></div>
    <button class="btn quiet wide" id="copy">${t.copyLink}</button>

  q("#copy").onclick = async () => { try { await navigator.clipboard.writeText(url); toast(t.copied); } catch(e){ toast(url); } };

/* ---------- poster ---------- */
function posterHTML(g){
  const t = T(), c = CAUSES[g.cause], unit = causeUnit(g.cause); const perYear = causePart(g)*NET_YIELD/c.cost;
  const yearly = perYear >= 1 ? t.yearly(Math.floor(perYear), unit) : t.per10(Math.max(1,Math.round(perYear*10)), unit);
  const photo = photos[g.id];
  return `<div class="poster" id="poster-${g.id}">
    <svg class="bg" viewBox="0 0 1080 1350" preserveAspectRatio="none" aria-hidden="true"><rect width="1080" height="1350" fill="#1C3A28"/><g fill="none" stroke="#2F5C3F" stroke-width="2" opacity=".55">${[...Array(9)].map((_,i)=>`<path d="M${-100+i*160} 1350 C ${i*160} 900, ${140+i*160} 700, ${60+i*160} 300"/>`).join("")}</g></svg>
    <div class="frame"></div>
    <div class="content"><div class="kicker">${occKick(g.occasion)}</div><div class="name">${esc(g.recipient.name)}</div>
      <div class="arch">${photo?`<img src="${photo}" alt="">`:esc(initial(g.recipient.name))}</div>
      <div class="line">${t.posterLine(yearly, esc(g.region), esc(g.recipient.name))}${trustPart(g)>0?`<div style="font-size:3cqw;opacity:.8;margin-top:2%">${t.posterPlus}</div>`:""}</div>
      <div class="from">${t.posterFrom(esc(g.giver.name), fmtDate(g.createdAt))}</div></div>
    <div class="footer"><div class="seal">Kado Abadi<small>${t.sealSub}</small></div><div class="qr" id="qr-${g.id}"></div></div>
    <div class="fid">giftkeepgiving.com &nbsp;·&nbsp; ${g.id}</div></div>`;
}
function drawQR(g){
  const el = document.getElementById("qr-"+g.id); if (!el || !window.QRCode) return;
  el.innerHTML = ""; try { new QRCode(el, { text: location.origin+location.pathname+"#/gift/"+g.id, width:256, height:256, colorDark:"#17301F", colorLight:"#F2F4EC", correctLevel:QRCode.CorrectLevel.M }); } catch(e){}
}

/* ---------- gift page ---------- */
function projectedStamps(g, fromYear){
  const c = CAUSES[g.cause]; const per = causePart(g)*NET_YIELD/c.cost; const out = []; const start = new Date(g.createdAt);
  for (let y=fromYear; y<fromYear+3; y++){ const d = new Date(start); d.setFullYear(start.getFullYear()+y); out.push({ proj:true, date:d.toISOString().slice(0,10), units:Math.max(1,Math.round(per)) }); }
  return out;
}
function renderGift(g){
  const t = T(), c = CAUSES[g.cause], unit = causeUnit(g.cause), verb = causeVerb(g.cause);
  const delivered = g.stamps.reduce((s,x)=>s+x.units,0);
  const yearsLive = Math.max(1, Math.floor((Date.now()-new Date(g.createdAt))/31557600000)+1);
  const proj = projectedStamps(g, g.stamps.length ? yearsLive : 1);
  const ca = causePart(g), tr = trustPart(g); const n = Math.max(1, Math.floor(ca*NET_YIELD/c.cost));
  const camp = g.campaignId && campaigns[g.campaignId];
  app.innerHTML = topBar() + `
  <div style="padding:12px 0 6px"><div class="muted small">${occKick(g.occasion)}</div><h1>${esc(g.recipient.name)}</h1>
    <p class="muted">${t.plantedBy(esc(g.giver.name), fmtDate(g.createdAt))}${g.message?`. <span class="serif" style="font-style:italic">“${esc(g.message)}”</span>`:""}</p></div>
  <a href="#/poster/${g.id}" style="text-decoration:none;display:block">${posterHTML(g)}</a>
  <p class="tiny" style="text-align:center;margin-top:8px">${t.tapPoster}</p>
  <div class="stat"><div><b>${rp(ca)}</b><span>${t.stillIn}</span></div><div><b>${delivered} ${unit}</b><span>${t.delivered(verb)}</span></div></div>
  ${tr>0 ? `<div class="priv-note"><span>🔒 ${t.giftTrustNote(rp(tr), esc(g.recipient.name))}</span></div>` : ""}
  <div class="section"><h3>${t.willGrow}</h3>
    <div class="strip">${[1,10,100].map(N=>`<div><b>${nf(calc.units(ca,c.cost,N))}</b><span>${t.inN(unit,N)}</span></div>`).join("")}</div>
    <p class="tiny">${t.projStrip(Math.round(NET_YIELD*100), calc.oneTime(ca,c.cost), unit, calc.crossover())}</p></div>
  <div class="section"><h3>${t.trail}</h3><ul class="timeline">
    ${g.stamps.map(s=>`<li><div class="when">${fmtDate(s.date)}</div><div class="what">${s.units} ${unit} ${verb}</div>
      <div class="stamp"><span class="share">${t.share(s.units, nf(s.total), unit)}</span>${t.stampTail(rp(s.amount), s.partner, s.location, s.proofs, causeName(g.cause), esc(g.region))}</div></li>`).join("")}
    ${proj.map(s=>`<li class="proj"><div class="when">${fmtDate(s.date)} ${t.projLbl}</div><div class="what">~${s.units} ${unit} ${verb}</div><div class="stamp">${t.projStamp}</div></li>`).join("")}
  </ul></div>
  <div class="section"><h3>${t.msgReceived}</h3>
    <div class="wa"><div class="who">Kitabisa</div>${esc(t.waText(g.giver.name, g.recipient.name, n, unit, verb))} <span style="color:#1F7A4F">${location.host}/#/gift/${g.id}</span><div class="time">${new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</div></div>
    <p class="tiny">${t.waNote}</p></div>
  <div class="section">
    ${camp ? `<a class="btn gold wide" href="#/c/${camp.id}">${t.viewPage} · ${esc(camp.title)}</a><div style="height:10px"></div><a class="btn quiet wide" href="#/create?c=${camp.id}">${t.joinFor(esc(g.recipient.name))}</a>`
           : `<a class="btn wide" href="#/create">${t.plantOther}</a>`}
  </div>`;
  drawQR(g); finish();
}

/* ---------- poster page ---------- */
function renderPoster(g){
  const t = T(), c = CAUSES[g.cause], unit = causeUnit(g.cause); const url = location.origin+location.pathname+"#/gift/"+g.id;
  const share = t.shareText(g.giver.name, g.recipient.name, Math.max(1,Math.floor(causePart(g)*NET_YIELD/c.cost)), unit, url);

  <a class="btn wide" href="https://wa.me/?text=${encodeURIComponent(share)}" target="_blank" rel="noopener">${t.shareWa}</a><div style="height:10px"></div>
  <button class="btn quiet wide" id="copy">${t.copyLink}</button><div style="height:10px"></div>
  <a class="btn quiet wide" href="#/gift/${g.id}">${t.backTo(esc(g.recipient.name))}</a>`;

}

/* ---------- owner dashboard (private) ---------- */
function renderOwner(c){
  const t = T(); const gs = campaignGifts(c.id).filter(g => trustPart(g) > 0); const all = campaignGifts(c.id);
  const saved = gs.reduce((s,g)=>s+trustPart(g),0); const months = ageMonths(c.date);
  const byYear = {}; gs.forEach(g => { const y = g.createdAt.slice(0,4); (byYear[y] ||= []).push(g); });
  const years = Object.keys(byYear).sort().reverse();
  const causeTot = all.reduce((s,g)=>s+causePart(g),0);
  app.innerHTML = topBar() + `
  <div class="owner-hero"><div class="kick">${t.ownerKick}</div><h1>${rp(saved)}</h1><div class="sub">${t.saved} · ${t.ownerH(esc(c.title))}</div><div class="sub" style="margin-top:8px">${t.ownerSub}</div></div>
  <div class="stat">
    <div><b>${gs.length}</b><span>${t.contributors}</span></div>
    <div><b>${t.ageLbl(months)}</b><span>${esc(c.title)} · ${fmtDate(c.date)}</span></div>
    <div><b>${rp(trustAt(saved, months, 18))}</b><span>${t.at18}</span></div>
    <div><b>${rp(trustAt(saved, months, 21))}</b><span>${t.at21}</span></div>
  </div>
  <p class="tiny">${t.trustIllus}</p>
  <div class="product"><div class="seal2">Kita<br>bisa</div><div><b>${t.productName}</b><span>${t.productSub}</span></div></div>
  <div class="section"><h3>${t.whoSaved}</h3>
    ${gs.length ? years.map(y => `<div class="yeargrp"><h4>${y} · ${rp(byYear[y].reduce((s,g)=>s+trustPart(g),0))}</h4><ul class="givers">${byYear[y].map(g => `<li><div class="avatar">${initial(g.giver.name)}</div><div style="flex:1">
      <div class="who"><span style="font-weight:600">${esc(g.giver.name)}</span><span>${rp(trustPart(g))}</span></div>
      <div class="meta">${fmtDate(g.createdAt)} · ${g.trustPct}% ${t.trustLbl.toLowerCase()} · ${100-g.trustPct}% ${t.causeLbl2.toLowerCase()} (${rp(causePart(g))})</div></div></li>`).join("")}</ul></div>`).join("") : `<p class="muted">${t.noSaved}</p>`}
  </div>
  <div class="section"><h3>${t.publicSide}</h3><p class="muted small">${t.impactSide(esc(c.title))} ${rp(causeTot)} · ${Math.floor(causeTot*NET_YIELD/CAUSES[c.cause].cost)} ${causeUnit(c.cause)}/${t.perYearShort}.</p>
    <a class="btn quiet wide" href="#/c/${c.id}">${t.backPublic}</a><div style="height:10px"></div>
    <a class="btn gold wide" href="https://wa.me/?text=${encodeURIComponent(t.cShare(c.title, location.origin+location.pathname+"#/c/"+c.id))}" target="_blank" rel="noopener">${t.reshare(nextBirthday(c.date).nth)}</a>
  </div>
  <p class="tiny" style="margin-top:16px">${t.ownerOnly}</p>`;
  finish();
}

/* ---------- landing B: gift-card form ---------- */
function renderLandingB(){
  const t = T(); draft.campaignId = null; draft.trustPct = 0;
  if (!CAUSES[draft.cause].region.includes(draft.region)) draft.region = CAUSES[draft.cause].region[0];
  const preview = { id:"KA-PREVIEW", occasion:draft.occasion, cause:draft.cause, region:draft.region, amount:draft.amount, recipient:{name:draft.recipient||"…"}, giver:{name:draft.giver||"…"}, message:draft.message, createdAt:new Date().toISOString().slice(0,10), stamps:[] };
  app.innerHTML = topBar() + `
  <section class="b-hero"><h1>${t.bH}</h1><p>${t.bP}</p></section>
  <div class="b-grid">
    <div class="b-form">
      <div class="b-sentence"><span>${t.bFrom}</span><span class="blank">${esc(draft.giver)||"&nbsp;"}</span><span>${t.bTo}</span><span class="blank">${esc(draft.recipient)||"&nbsp;"}</span><span>${t.bFor}</span><span class="blank">${occName(draft.occasion).toLowerCase()}</span></div>
      <div class="b-row">
        <div class="field"><label for="bg">${t.from}</label><input class="input" id="bg" placeholder="${t.yourName}" value="${esc(draft.giver)}"></div>
        <div class="field"><label for="br">${t.recipName}</label><input class="input" id="br" placeholder="Thomas" value="${esc(draft.recipient)}"></div>
      </div>
      <div class="b-row three">
        <div class="field"><label for="bo">${t.bOccasion}</label><select class="input" id="bo">${Object.keys(PHOTOS).map(k=>`<option value="${k}" ${k===draft.occasion?"selected":""}>${occName(k)}</option>`).join("")}</select></div>
        <div class="field"><label for="bc">${t.bCause}</label><select class="input" id="bc">${Object.keys(CAUSES).map(k=>`<option value="${k}" ${k===draft.cause?"selected":""}>${causeName(k)}</option>`).join("")}</select></div>
        <div class="field"><label for="bre">${t.where}</label><select class="input" id="bre">${CAUSES[draft.cause].region.map(r=>`<option ${r===draft.region?"selected":""}>${r}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label>${t.bAmount}</label><div class="amount"><b id="bamt">${rp(draft.amount)}</b><span class="small muted">~${Math.floor(draft.amount*NET_YIELD/CAUSES[draft.cause].cost)} ${causeUnit(draft.cause)}/${t.perYearShort}</span></div><input type="range" id="bam" min="${MIN_GIFT}" max="${MAX_GIFT}" step="${STEP}" value="${draft.amount}"></div>
      <div class="field"><label for="bm">${t.bMsg}</label><textarea class="input" id="bm" placeholder="${t.msgPh}">${esc(draft.message)}</textarea></div>
      <button class="btn wide" id="bsend">${t.bSend} →</button>
      <p class="tiny" style="text-align:center;margin-top:10px">${t.bFoot}</p>
    </div>
    <div class="b-card"><p class="small muted" style="margin-bottom:8px">${t.bPreview}</p>${posterHTML(preview)}</div>
  </div>
  <p class="ab">${t.abTry} <a href="#/">${t.abA}</a></p>`;
  const sync = () => renderLandingB();
  q("#bg").oninput = e => { draft.giver = e.target.value; liveB(); }; q("#br").oninput = e => { draft.recipient = e.target.value; liveB(); };
  q("#bo").onchange = e => { draft.occasion = e.target.value; sync(); }; q("#bc").onchange = e => { draft.cause = e.target.value; draft.region = CAUSES[draft.cause].region[0]; sync(); };
  q("#bre").onchange = e => { draft.region = e.target.value; liveB(); }; q("#bam").oninput = e => { draft.amount = +e.target.value; q("#bamt").textContent = rp(draft.amount); liveB(); };
  q("#bm").oninput = e => { draft.message = e.target.value; };
  q("#bsend").onclick = openPay;
  drawQR(preview); finish();
}
function liveB(){
  const t = T(); const bl = document.querySelectorAll(".b-sentence .blank"); if (bl.length===3){ bl[0].innerHTML = esc(draft.giver)||"&nbsp;"; bl[1].innerHTML = esc(draft.recipient)||"&nbsp;"; }
  const card = q(".b-card"); if (card){ const preview = { id:"KA-PREVIEW", occasion:draft.occasion, cause:draft.cause, region:draft.region, amount:draft.amount, recipient:{name:draft.recipient||"…"}, giver:{name:draft.giver||"…"}, message:draft.message, createdAt:new Date().toISOString().slice(0,10), stamps:[] }; card.innerHTML = `<p class="small muted" style="margin-bottom:8px">${t.bPreview}</p>` + posterHTML(preview); drawQR(preview); }
  const s = q("#bamt"); if (s) s.nextElementSibling.textContent = `~${Math.floor(draft.amount*NET_YIELD/CAUSES[draft.cause].cost)} ${causeUnit(draft.cause)}/${t.perYearShort}`;
}

function toast(msg){ const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("show"), 2600); }

/* ---------- boot ---------- */
try {
  const boot = () => {
    render();
    if (!window.QRCode) { let tries = 0; const iv = setInterval(()=>{ if (window.QRCode || ++tries > 60) { clearInterval(iv); const { p, id } = route(); if (window.QRCode && (p==="gift"||p==="poster") && gifts[id]) drawQR(gifts[id]); } }, 100); }
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
} catch(e) {
  document.getElementById("app").innerHTML = '<div style="padding:40px 20px;font-family:sans-serif;max-width:460px;margin:0 auto"><p style="font-size:18px">🌱 Kado Abadi</p><p style="background:#300;padding:12px;border-radius:8px;font-size:13px;font-family:monospace;word-break:break-all">'+e.message+'</p></div>';
  console.error("Kado Abadi boot error:", e);
}
</script>
